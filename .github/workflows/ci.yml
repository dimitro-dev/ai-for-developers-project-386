name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Перечня проверок здесь нет намеренно: он определён единственный раз — рецептом
      # цели `gates` в корневом Makefile, и локальная фаза «Проверка» гоняет то же самое.
      - run: make gates

  # Ловит дрейф compose.yml и init-скрипта. Идёт параллельно checks: критический путь проверок
  # не удлиняется. Docker на GitHub-hosted Linux-раннерах предустановлен, ставить нечего;
  # npm здесь не нужен — жизненный цикл контура ведут цели зоны infra, а два запроса psql
  # ниже — утверждения самой проверки, а не проектные команды.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Валидация конфигурации без .env
        run: make -C infra config
      - name: Поднять контур и дождаться healthy
        run: make -C infra up
      - name: Проверить базу разработки
        run: docker compose -f infra/compose.yml exec -T postgres psql -U minical -d minical -c 'select 1;'
      - name: Проверить тестовую базу
        run: docker compose -f infra/compose.yml exec -T postgres psql -U minical -d minical_test -c 'select 1;'
      - name: Остановить контур и удалить volume
        if: always()
        run: make -C infra reset
