openapi: 3.0.0
info:
  title: MiniCal Smoke API
  description: |-
    Smoke-контракт для проверки generation pipeline (task-000).
    Не содержит доменной спецификации MiniCal: продуктовый API описывает task-002.
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - uptimeSeconds
      properties:
        status:
          type: string
          enum:
            - ok
        uptimeSeconds:
          type: number
          format: double
      description: Ответ health-проверки smoke-сервера.
